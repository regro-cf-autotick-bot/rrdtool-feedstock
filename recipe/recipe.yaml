schema_version: 1

context:
  name: rrdtool
  version: "1.10.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/oetiker/rrdtool-1.x/archive/v${{ version }}.tar.gz
  sha256: 3f98a07cf00a16a811716f925e0ccb105a51183743bbd65b997aea11c9e15943
  patches:
    # Link libcairo directly; rrdtool uses it but only links -lpangocairo
    - link-libcairo.patch

build:
  # Fails with "Bad CPU type in executable" when cross-compiling
  number: 0
  skip:
    - win
    - ppc64le
  python:
    skip_pyc_compilation:
      - if: osx and arm64
        then: share/rrdtool/examples/stripes.py
  dynamic_linking:
    # Everything librrd links is a declared dependency and every declared
    # dependency is linked, so hold that line and fail the build if it slips.
    overlinking_behavior: error
    overdepending_behavior: error

requirements:
  build:
    - if: unix
      then: gnuconfig
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - autoconf
    - automake
    - harfbuzz
    - make
    - libtool
    # msgfmt/autopoint to compile & bootstrap the .po catalogs; runs on the
    # build machine, so build- (not host-) side for correct cross-compilation
    - gettext-tools
    - pkg-config
    # Required for "make check"
    - coreutils
    - bc
  host:
    - cairo
    - glib
    - libpng
    - libxml2-devel
    - pango
    # gettext is external (AM_GNU_GETTEXT); libintl is part of glibc on Linux
    # but a separate library on macOS, so it is only needed there.
    - if: osx
      then: libintl-devel
  run:
    # pango's run-export already applies a compatible pin; libintl has no
    # run-export, so the macOS runtime dependency must be listed explicitly.
    - if: osx
      then: libintl

tests:
  - script:
      # End-to-end: create -> update -> graph. `graph` renders through
      # cairo/pango, so it also proves libcairo is linked and usable at runtime.
      - rrdtool create test.rrd --step 300 DS:x:GAUGE:600:U:U RRA:AVERAGE:0.5:1:24
      - rrdtool update test.rrd N:42
      - rrdtool graph test.png --start end-2h DEF:x=test.rrd:x:AVERAGE LINE1:x#ff0000
      - test -s test.png
  - package_contents:
      # strict: every packaged file must match a pattern below, so anything
      # unexpected (e.g. the stray fontconfig cache we now clean up) fails.
      strict: true
      bin:
        - rrdtool
        - rrdcached
        - rrdcgi
        - rrdcreate
        - rrdinfo
        - rrdupdate
      lib:
        - librrd
      include:
        - rrd.h
        - rrd_client.h
        - rrd_format.h
      files:
        # Broad, directory-level globs so new examples/locales or a soname bump
        # are absorbed while strict still flags anything outside these paths.
        - bin/rrd*
        - include/rrd*.h
        - lib/librrd.*
        - lib/pkgconfig/librrd.pc
        - lib/systemd/system/rrdcached.*
        - share/locale/*/LC_MESSAGES/*.mo
        - share/rrdtool/**

about:
  license: GPL-2.0-or-later
  license_file: LICENSE
  summary: Round Robin Database Tool
  description: |
    RRDtool is a little program for easily maintaining a database of
    time-series data. It comes with a charting program for drawing
    pretty graphs based on the data stored.
  homepage: https://www.rrdtool.org
  repository: https://github.com/oetiker/rrdtool-1.x/
  documentation: https://www.rrdtool.org/doc/index.en.html

extra:
  recipe-maintainers:
    - chrisburr
