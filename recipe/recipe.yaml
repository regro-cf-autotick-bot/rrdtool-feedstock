schema_version: 1

context:
  name: rrdtool
  version: "1.10.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/oetiker/rrdtool-1.x/archive/v${{ version }}.tar.gz
  sha256: 3f98a07cf00a16a811716f925e0ccb105a51183743bbd65b997aea11c9e15943

build:
  # Fails with "Bad CPU type in executable" when cross-compiling
  number: 0
  skip:
    - win
    - ppc64le
  python:
    skip_pyc_compilation:
      - if: osx and arm64
        then: share/rrdtool/examples/stripes.py

requirements:
  build:
    - if: unix
      then: gnuconfig
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - autoconf
    - automake
    - harfbuzz
    - make
    - libtool
    - pkg-config
    # Required for "make check"
    - coreutils
    - bc
  host:
    - cairo
    - gettext
    - glib
    - libpng
    - libxml2-devel
    - pango
  run:
    # Looks pretty stable
    # https://abi-laboratory.pro/index.php?view=timeline&l=pango
    - ${{ pin_compatible('pango') }}

tests:
  - script:
      - rrdtool --help

about:
  license: GPL-2.0-or-later
  license_file: LICENSE
  summary: Round Robin Database Tool
  description: |
    RRDtool is a little program for easily maintaining a database of
    time-series data. It comes with a charting program for drawing
    pretty graphs based on the data stored.
  homepage: https://www.rrdtool.org
  repository: https://github.com/oetiker/rrdtool-1.x/
  documentation: https://www.rrdtool.org/doc/index.en.html

extra:
  recipe-maintainers:
    - chrisburr

